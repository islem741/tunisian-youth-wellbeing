{% extends "base.html" %}
{% load django_bootstrap5 %}
{% block title %}Sign in · Tunisian Youth Well-being{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3">Sign in</h1>
        <p class="text-muted small">
          Use one of the seeded role accounts (see <code>README.md</code>):
          <code>operator1</code>, <code>supervisor1</code>, <code>admin1</code>.
        </p>
        <form method="post">
          {% csrf_token %}
          {% bootstrap_form form %}
          <button type="submit" class="btn btn-primary w-100">Sign in</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
