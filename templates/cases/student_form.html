{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block title %}New Student Record{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <h1 class="h3 mb-4">Create Student Record</h1>
    <div class="card shadow-sm">
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          {% bootstrap_form form %}
          <button class="btn btn-primary">Save Student</button>
          <a href="{% url 'cases:list' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
